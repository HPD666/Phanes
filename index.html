<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phanes.                     </title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --hud-bg: rgba(5, 10, 15, 0.90);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanlines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 2;
        }

        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--hud-bg);
            padding: 12px 24px;
            border-left: 4px solid var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            z-index: 3;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--neon-yellow);
        }

        .hud-card {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 360px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 20px;
            display: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            z-index: 3;
        }

        .hud-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 5px;
        }

        .hud-card .data-row {
            margin: 6px 0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #888; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            margin: 10px 0;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--neon-yellow);
            box-shadow: 0 0 8px var(--neon-yellow);
            transition: width 0.1s linear;
        }

        .desc-box {
            margin-top: 10px;
            padding: 8px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            font-size: 0.80rem;
            color: #ddd;
            line-height: 1.3;
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 3;
        }

        button {
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    <div class="scanlines"></div>

    <div class="hud-header">
        <h1>PHANES // FOCUS HUD v2.5</h1>
        <span id="status">PRESS INITIALIZE TO ENGAGE</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET ACQUIRED</h2>
        <div class="data-row"><span class="label">ENTITY:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">SCAN PROGRESS:</span> <span id="card-pct" class="val" style="color:var(--neon-yellow);">0%</span></div>
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="data-row"><span class="label">BRAND / ORIGIN:</span> <span id="card-brand" class="val">-</span></div>
        <div class="data-row"><span class="label">EST. VALUE / COST:</span> <span id="card-price" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">SOCIAL / LINK:</span> <span id="card-social" class="val" style="color:var(--neon-cyan);">-</span></div>
        <div class="desc-box" id="card-desc">Scanning visual target registers...</div>
    </div>

    <div class="controls">
        <button onclick="initApp()">INITIALIZE FOCUS SCANNER</button>
    </div>
</div>

<script>
    let objectModel, faceModel;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');
    const progressFill = document.getElementById('progress-fill');
    const cardPct = document.getElementById('card-pct');

    // Persistence & Progress state tracking variables
    let currentLockedTarget = null;
    let targetBox = null;
    let scanProgress = 0;
    let persistentCounter = 0;
    const PERSIST_LIMIT = 25; // Keeps tracking for ~25 frames (~1 second) after losing sight

    const KNOWLEDGE_BASE = {
        cell_phone: {
            title: "SMARTPHONE TARGET",
            brand: "Apple / Samsung / Google",
            price: "$799 - $1,199 USD",
            social: "@tech_reviews / #mobile",
            desc: "High-density mobile terminal equipped with multi-lens optical array and neural processing unit."
        },
        car: {
            title: "MOTOR VEHICLE",
            brand: "Tesla / BMW / CyberMotors",
            price: "$42,000 - $85,000 USD",
            social: "@autoworld_daily",
            desc: "Autonomous or semi-autonomous passenger vehicle with electric or hybrid drivetrain."
        },
        laptop: {
            title: "COMPUTING WORKSTATION",
            brand: "Dell / Lenovo / Apple",
            price: "$1,200 - $2,499 USD",
            social: "@cyber_hardware",
            desc: "Portable terminal featuring multi-core silicon, high-refresh display, and integrated encrypted storage."
        },
        bottle: {
            title: "BEVERAGE CONTAINER",
            brand: "Hydro / Stanley / Generic",
            price: "$15 - $45 USD",
            social: "#hydration_tech",
            desc: "Insulated liquid vessel engineered for heat retention and durable field usage."
        },
        person: {
            title: "HUMAN SUBJECT DETECTED",
            brand: "Biometric Subject #802",
            price: "N/A (CLASSIFIED)",
            social: "@subject_profile_linked",
            desc: "Biological entity locked. Face detection algorithm active. Privacy protocols obfuscating registry match."
        }
    };

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 },
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "LOADING NEURAL VISION NETWORKS...";
        objectModel = await cocoSsd.load();
        faceModel = await blazeface.load();
        
        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusText.innerText = "FOCUS SCANNER ACTIVE";
        scanFrame();
    }

    async function scanFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const objects = await objectModel.detect(video);
        const faces = await faceModel.estimateFaces(video, false);

        let detectedInFrame = null;
        let detectedBox = null;

        // Process Objects
        objects.forEach(obj => {
            if (obj.score > 0.45 && !detectedInFrame) {
                detectedInFrame = obj.class.toLowerCase();
                detectedBox = obj.bbox;
            }
        });

        // Process Faces
        faces.forEach(face => {
            if (!detectedInFrame) {
                detectedInFrame = 'person';
                const x = face.topLeft[0];
                const y = face.topLeft[1];
                const w = face.bottomRight[0] - x;
                const h = face.bottomRight[1] - y;
                detectedBox = [x, y, w, h];
            }
        });

        // Sticky Lock Memory Engine
        if (detectedInFrame) {
            currentLockedTarget = detectedInFrame;
            targetBox = detectedBox;
            persistentCounter = PERSIST_LIMIT; // Reset hold counter
        } else if (persistentCounter > 0) {
            persistentCounter--; // Smooth countdown when target moves briefly out of frame
        } else {
            currentLockedTarget = null;
            targetBox = null;
            scanProgress = 0;
        }

        // Render HUD Target & Manage Progress Bar
        if (currentLockedTarget && targetBox) {
            const [x, y, w, h] = targetBox;
            
            // Advance scan progress smoothly up to 100%
            if (scanProgress < 100) {
                scanProgress += 4; // Increment speed
                if (scanProgress > 100) scanProgress = 100;
            }

            // Draw HUD target box and progress ring
            drawHudBox(x, y, w, h, '#00f3ff', currentLockedTarget.toUpperCase(), scanProgress);

            // Update UI card details
            infoCard.style.display = 'block';
            cardPct.innerText = `${scanProgress}%`;
            progressFill.style.width = `${scanProgress}%`;

            const data = KNOWLEDGE_BASE[currentLockedTarget] || {
                title: "GENERIC OBJECT",
                brand: "Unknown Brand",
                price: "Market Search Active",
                social: "#unindexed",
                desc: "Target category verified in public dataset."
            };

            document.getElementById('card-title').innerText = scanProgress < 100 ? "SEARCHING MARKET..." : data.title;
            document.getElementById('card-entity').innerText = currentLockedTarget.toUpperCase();
            document.getElementById('card-brand').innerText = scanProgress < 100 ? "Scanning..." : data.brand;
            document.getElementById('card-price').innerText = scanProgress < 100 ? "Calculating..." : data.price;
            document.getElementById('card-social').innerText = scanProgress < 100 ? "Resolving..." : data.social;
            document.getElementById('card-desc').innerText = scanProgress < 100 ? "Analyzing visual signature..." : data.desc;

        } else {
            infoCard.style.display = 'none';
        }

        requestAnimationFrame(scanFrame);
    }

    function drawHudBox(x, y, w, h, color, label, progress) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        // Reticle Corners
        ctx.fillStyle = '#ffee00';
        ctx.fillRect(x - 3, y - 3, 6, 6);
        ctx.fillRect(x + w - 3, y + h - 3, 6, 6);

        // Progress Bar overlay under the bounding box
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(x, y + h + 5, w, 6);
        ctx.fillStyle = '#ffee00';
        ctx.fillRect(x, y + h + 5, (w * progress) / 100, 6);

        // Text Tag
        ctx.fillStyle = color;
        ctx.font = "12px 'Courier New'";
        ctx.fillText(`[ ${label} ] - ${progress}%`, x, y - 8);
    }
</script>
</body>
</html>
