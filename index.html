<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phanes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-orange: #ff9900;
            --hud-bg: rgba(2, 8, 14, 0.94);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(0, 243, 255, 0.2);
            pointer-events: none;
            z-index: 2;
        }

        .hud-header {
            position: absolute;
            top: 25px;
            left: 35px;
            background: var(--hud-bg);
            padding: 12px 24px;
            border-left: 4px solid var(--neon-cyan);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            z-index: 3;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
        }

        .hud-header span {
            font-size: 0.78rem;
            color: var(--neon-green);
        }

        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 410px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 22px;
            display: none;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.22);
            z-index: 3;
            backdrop-filter: blur(10px);
        }

        .hud-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.15rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 6px;
            letter-spacing: 1px;
        }

        .hud-card .data-row {
            margin: 7px 0;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #8a9ba8; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .desc-box {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--neon-green);
            font-size: 0.82rem;
            color: #d1e0ea;
            line-height: 1.4;
        }

        .toast {
            position: absolute;
            top: 30px;
            right: 35px;
            background: var(--neon-orange);
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 4px;
            box-shadow: 0 0 20px var(--neon-orange);
            display: none;
            z-index: 10;
        }

        .controls {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 3;
        }

        button {
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 14px 32px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.25s ease;
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="hud-border"></div>

    <div id="toast-msg" class="toast">TEXT COPIED TO CLIPBOARD!</div>

    <div class="hud-header">
        <h1>PHANES // PRECISION OCR & PROTRUSION v11.0</h1>
        <span id="status">SYSTEM IDLE // INITIALIZE MATRIX</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET LOCK ACTIVE</h2>
        <div class="data-row"><span class="label">IDENTITY:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">NEURAL CONSENSUS:</span> <span id="card-conf" class="val" style="color:var(--neon-green);">-</span></div>
        <div class="data-row"><span class="label">SPATIAL RATIO:</span> <span id="card-ratio" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">EST. VALUE RANGE:</span> <span id="card-price" class="val" style="color:var(--neon-cyan);">-</span></div>
        <div class="desc-box" id="card-desc">Analyzing temporal geometry...</div>
    </div>

    <div class="controls">
        <button onclick="initApp()">ENGAGE MATRIX</button>
    </div>
</div>

<script>
    let objectModel, faceModel, ocrWorker;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');
    const toast = document.getElementById('toast-msg');

    // Offscreen canvas for OCR image binarization
    const ocrCanvas = document.createElement('canvas');
    const ocrCtx = ocrCanvas.getContext('2d');

    let detectedTexts = [];
    let detectedEdges = [];
    let activeTrack = null;
    let smoothBox = null;
    let frameHistory = [];
    const HISTORY_LIMIT = 12;
    let isProcessingOcr = false;

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 },
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "INITIALIZING MULTI-LANG OCR (ENG+TUR)...";
        objectModel = await cocoSsd.load();
        faceModel = await blazeface.load();
        
        // Load both English and Turkish OCR models for high precision
        ocrWorker = await Tesseract.createWorker(['eng', 'tur']);

        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ocrCanvas.width = canvas.width;
        ocrCanvas.height = canvas.height;
        
        statusText.innerText = "PRECISION MATRIX ACTIVE // OCR & EDGE GUARD ONLINE";

        canvas.addEventListener('click', handleCanvasClick);

        scanFrame();
        setInterval(runPrecisionOcrScan, 1800);
    }

    function applyEnhancementFilter() {
        ctx.filter = "brightness(2.8) contrast(1.7) saturate(1.1)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.filter = "none";
    }

    // High-Contrast Grayscale Preprocessing to sharpen text for Tesseract
    function prepareOcrFrame() {
        ocrCtx.drawImage(video, 0, 0, ocrCanvas.width, ocrCanvas.height);
        const imgData = ocrCtx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
        const d = imgData.data;

        for (let i = 0; i < d.length; i += 4) {
            let avg = 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
            let v = avg > 110 ? 255 : 0; // High contrast thresholding
            d[i] = v;
            d[i+1] = v;
            d[i+2] = v;
        }
        ocrCtx.putImageData(imgData, 0, 0);
    }

    async function runPrecisionOcrScan() {
        if (isProcessingOcr) return;
        isProcessingOcr = true;

        try {
            prepareOcrFrame();
            const result = await ocrWorker.recognize(ocrCanvas);
            
            // Strict Regex filter: Require valid Latin/Turkish characters and confidence > 68%
            const validRegex = /^[a-zA-Z0-9çğıöşüÇĞİÖŞÜ\-\.]{2,}$/;

            detectedTexts = result.data.words.filter(w => {
                const textStr = w.text.trim();
                return w.confidence >= 68 && validRegex.test(textStr);
            }).map(w => ({
                text: w.text.trim(),
                bbox: { x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1 }
            }));
        } catch (e) {
            console.error("OCR Error:", e);
        }

        isProcessingOcr = false;
    }

    // Precision Continuous Line Detection for Shelf Lips & Protrusions
    function detectPhysicalProtrusions() {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const w = canvas.width;
        const h = canvas.height;
        const prominentEdges = [];

        // Scan for continuous horizontal gradient lines (shelf ledges, desk borders)
        for (let y = 80; y < h - 80; y += 30) {
            let consecutiveLine = 0;
            let startX = 0;

            for (let x = 60; x < w - 60; x += 10) {
                const idx = (y * w + x) * 4;
                const nextIdx = ((y + 12) * w + x) * 4;
                
                const lum1 = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
                const lum2 = 0.299 * data[nextIdx] + 0.587 * data[nextIdx+1] + 0.114 * data[nextIdx+2];

                if (Math.abs(lum1 - lum2) > 110) { // High gradient jump
                    if (consecutiveLine === 0) startX = x;
                    consecutiveLine++;
                } else {
                    if (consecutiveLine >= 8) { // Require contiguous physical length (>=80px)
                        prominentEdges.push({ x: startX, y, w: consecutiveLine * 10, h: 10 });
                    }
                    consecutiveLine = 0;
                }
            }
        }
        return prominentEdges.slice(0, 3); // Max 3 dominant structural edges
    }

    async function scanFrame() {
        applyEnhancementFilter();

        const rawObjects = await objectModel.detect(canvas);
        const faces = await faceModel.estimateFaces(canvas, false);
        detectedEdges = detectPhysicalProtrusions();

        let validatedLabel = null;
        let bestBox = null;
        let maxScore = 0;

        const cWidth = canvas.width;
        const cHeight = canvas.height;

        rawObjects.forEach(obj => {
            const [x, y, w, h] = obj.bbox;
            const area = w * h;
            const aspectRatio = w / h; 
            const vertRatio = h / w;
            const relativeY = y / cHeight;
            let cls = obj.class.toLowerCase();

            if (obj.score < 0.55 || area < 2500) return;

            if (cls === 'refrigerator' || cls === 'microwave' || cls === 'tv') {
                if (aspectRatio >= 1.35 && relativeY < 0.45) {
                    cls = 'air_conditioner';
                } else if (vertRatio >= 1.05 && relativeY > 0.15) {
                    cls = 'refrigerator';
                }
            }

            if (cls === 'airplane' || cls === 'kite') {
                if (vertRatio > 0.85 || relativeY > 0.1) {
                    cls = 'lamp_fixture';
                }
            }

            if (cls === 'vase' || cls === 'bottle') {
                if (relativeY < 0.6 && vertRatio > 1.3) {
                    cls = 'lamp_fixture';
                }
            }

            if (cls === 'person' && (w < 150 || h < 150 || aspectRatio > 1.6)) return;

            if (obj.score > maxScore) {
                maxScore = obj.score;
                validatedLabel = cls;
                bestBox = obj.bbox;
            }
        });

        faces.forEach(face => {
            const x = face.topLeft[0];
            const y = face.topLeft[1];
            const w = face.bottomRight[0] - x;
            const h = face.bottomRight[1] - y;
            const ratio = w / h;

            if (w > 55 && h > 55 && ratio >= 0.65 && ratio <= 1.35) {
                validatedLabel = 'human_subject';
                bestBox = [x, y, w, h];
                maxScore = 0.98;
            }
        });

        if (validatedLabel && bestBox) {
            frameHistory.push({ label: validatedLabel, box: bestBox, score: Math.round(maxScore * 100) });
        } else {
            frameHistory.push(null);
        }

        if (frameHistory.length > HISTORY_LIMIT) frameHistory.shift();

        const counts = {};
        let winner = null;
        let winnerCount = 0;

        frameHistory.forEach(item => {
            if (item) {
                counts[item.label] = (counts[item.label] || 0) + 1;
                if (counts[item.label] > winnerCount) {
                    winnerCount = counts[item.label];
                    winner = item.label;
                }
            }
        });

        if (winner && winnerCount >= 5) {
            const latestMatch = [...frameHistory].reverse().find(i => i && i.label === winner);
            activeTrack = { label: winner, score: latestMatch.score };

            if (!smoothBox) {
                smoothBox = [...latestMatch.box];
            } else {
                smoothBox[0] = smoothBox[0] * 0.7 + latestMatch.box[0] * 0.3;
                smoothBox[1] = smoothBox[1] * 0.7 + latestMatch.box[1] * 0.3;
                smoothBox[2] = smoothBox[2] * 0.7 + latestMatch.box[2] * 0.3;
                smoothBox[3] = smoothBox[3] * 0.7 + latestMatch.box[3] * 0.3;
            }
        } else {
            activeTrack = null;
            smoothBox = null;
        }

        if (activeTrack && smoothBox) {
            const [x, y, w, h] = smoothBox;
            drawReticle(x, y, w, h, activeTrack.label.toUpperCase());

            infoCard.style.display = 'block';
            document.getElementById('card-conf').innerText = `${activeTrack.score}% (CONSENSUS LOCKED)`;
            document.getElementById('card-ratio').innerText = `${(w/h).toFixed(2)} [W:H]`;

            renderMetadata(activeTrack.label, w, h);
        } else {
            infoCard.style.display = 'none';
        }

        // Render clean orange highlights
        drawProtrusions(detectedEdges);
        drawOrangeTextHighlights(detectedTexts);

        requestAnimationFrame(scanFrame);
    }

    function drawOrangeTextHighlights(texts) {
        texts.forEach(item => {
            const b = item.bbox;
            const w = b.x1 - b.x0;
            const h = b.y1 - b.y0;

            ctx.fillStyle = "rgba(255, 153, 0, 0.25)";
            ctx.fillRect(b.x0, b.y0, w, h);

            ctx.strokeStyle = "#ff9900";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(b.x0, b.y0, w, h);

            ctx.fillStyle = "#ff9900";
            ctx.font = "12px 'Share Tech Mono'";
            ctx.fillText(`[TXT: ${item.text}]`, b.x0, b.y0 - 5);
        });
    }

    function drawProtrusions(edges) {
        edges.forEach(e => {
            ctx.strokeStyle = "#ff9900";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(e.x, e.y, e.w, e.h);
            ctx.setLineDash([]);

            ctx.fillStyle = "#ff9900";
            ctx.font = "11px 'Share Tech Mono'";
            ctx.fillText("[SHELF / PROTRUSION BORDER]", e.x, e.y - 4);
        });
    }

    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        detectedTexts.forEach(item => {
            const b = item.bbox;
            if (clickX >= b.x0 && clickX <= b.x1 && clickY >= b.y0 && clickY <= b.y1) {
                navigator.clipboard.writeText(item.text);
                showToast(`COPIED: "${item.text}"`);
            }
        });
    }

    function showToast(msg) {
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function renderMetadata(label, w, h) {
        const titleEl = document.getElementById('card-title');
        const entityEl = document.getElementById('card-entity');
        const priceEl = document.getElementById('card-price');
        const descEl = document.getElementById('card-desc');

        if (label === 'air_conditioner') {
            titleEl.innerText = "AIR CONDITIONER UNIT";
            entityEl.innerText = "HVAC / COOLING APPLIANCE";
            priceEl.innerText = "$300.00 - $1,200.00 USD";
            descEl.innerText = "Horizontal spatial geometry and overhead mounting height validated.";
        } else if (label === 'refrigerator') {
            titleEl.innerText = "REFRIGERATOR";
            entityEl.innerText = "KITCHEN COOLING TOWER";
            priceEl.innerText = "$600.00 - $2,800.00 USD";
            descEl.innerText = "Vertical aspect ratio (H > W) and floor depth verified.";
        } else if (label === 'lamp_fixture') {
            titleEl.innerText = "LIGHTING FIXTURE / LAMP";
            entityEl.innerText = "LUMINAIRE SYSTEM";
            priceEl.innerText = "$25.00 - $180.00 USD";
            descEl.innerText = "Grounded indoor profile confirmed. Rejection guard prevented false airplane trigger.";
        } else if (label === 'human_subject') {
            titleEl.innerText = "HUMAN SUBJECT";
            entityEl.innerText = "BIOMETRIC ENTITY";
            priceEl.innerText = "VERIFIED BIOMETRIC";
            descEl.innerText = "Facial mesh alignment verified via real-time geometric vision lock.";
        } else {
            titleEl.innerText = label.toUpperCase();
            entityEl.innerText = label.toUpperCase();
            priceEl.innerText = "VERIFIED ENTITY";
            descEl.innerText = "Consensus matrix validated object identity across temporal buffer.";
        }
    }

    function drawReticle(x, y, w, h, label) {
        const cLen = Math.min(w, h) * 0.25;

        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y);
        ctx.moveTo(x + w - cLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cLen);
        ctx.moveTo(x, y + h - cLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cLen, y + h);
        ctx.moveTo(x + w - cLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cLen);
        ctx.stroke();

        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - 5, cy - 5, 10, 10);

        ctx.fillStyle = '#00f3ff';
        ctx.font = "13px 'Share Tech Mono'";
        ctx.fillText(`[ CONSENSUS LOCK // ${label} ]`, x, y - 10);
    }
</script>
</body>
</html>
