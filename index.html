<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANES // </title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --hud-bg: rgba(2, 8, 14, 0.94);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(0, 243, 255, 0.25);
            pointer-events: none;
            z-index: 2;
        }

        .hud-header {
            position: absolute;
            top: 25px;
            left: 35px;
            background: var(--hud-bg);
            padding: 12px 24px;
            border-left: 4px solid var(--neon-cyan);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            z-index: 3;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
        }

        .hud-header span {
            font-size: 0.78rem;
            color: var(--neon-green);
        }

        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 400px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 22px;
            display: none;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25);
            z-index: 3;
            backdrop-filter: blur(10px);
        }

        .hud-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.15rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 6px;
            letter-spacing: 1px;
        }

        .hud-card .data-row {
            margin: 8px 0;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #8a9ba8; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .desc-box {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--neon-cyan);
            font-size: 0.82rem;
            color: #d1e0ea;
            line-height: 1.4;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .lens-btn, .freeze-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .freeze-btn {
            background: var(--neon-yellow);
        }

        .lens-btn:hover, .freeze-btn:hover {
            box-shadow: 0 0 20px var(--neon-cyan);
            filter: brightness(1.2);
        }

        .controls {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 3;
            display: flex;
            gap: 10px;
        }

        .main-btn {
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 14px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.25s ease;
        }

        .main-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="hud-border"></div>

    <div class="hud-header">
        <h1>PHANES // ULTRA MATRIX v8.0</h1>
        <span id="status">STANDBY // PRESS INITIALIZE</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET LOCK ACTIVE</h2>
        <div class="data-row"><span class="label">NIGHT VISION:</span> <span id="card-nv" class="val" style="color:var(--neon-green);">ENHANCED (3.5X)</span></div>
        <div class="data-row"><span class="label">FRAME LOCK:</span> <span id="card-lock" class="val" style="color:var(--neon-yellow);">REAL-TIME</span></div>
        
        <div class="desc-box" id="card-desc">
            Align object inside the center frame. Click FREEZE FRAME to lock the snapshot, then search instantly.
        </div>

        <div class="action-grid">
            <button class="freeze-btn" onclick="toggleFreeze()">FREEZE / UNFREEZE</button>
            <button class="lens-btn" onclick="triggerSearch()">GOOGLE LENS SEARCH</button>
        </div>
    </div>

    <div class="controls">
        <button class="main-btn" onclick="initApp()">ENGAGE SYSTEM</button>
        <button class="main-btn" onclick="toggleTorch()">TOGGLE TORCH</button>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');

    let isScanning = false;
    let isFrozen = false;
    let mediaTrack = null;
    let torchState = false;

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
        });
        video.srcObject = stream;
        mediaTrack = stream.getVideoTracks()[0];
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "INITIALIZING ULTRA STREAM...";
        await setupCamera();
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusText.innerText = "NIGHT VISION MATRIX // ACTIVE";
        isScanning = true;
        infoCard.style.display = 'block';
        
        scanLoop();
    }

    function toggleFreeze() {
        isFrozen = !isFrozen;
        const lockEl = document.getElementById('card-lock');
        if (isFrozen) {
            lockEl.innerText = "LOCKED / FROZEN";
            lockEl.style.color = "var(--neon-red)";
            statusText.innerText = "FRAME FROZEN // READY FOR ANALYSIS";
        } else {
            lockEl.innerText = "REAL-TIME";
            lockEl.style.color = "var(--neon-yellow)";
            statusText.innerText = "NIGHT VISION MATRIX // ACTIVE";
        }
    }

    async function toggleTorch() {
        if (!mediaTrack) return;
        try {
            torchState = !torchState;
            await mediaTrack.applyConstraints({
                advanced: [{ torch: torchState }]
            });
        } catch (e) {
            statusText.innerText = "TORCH HARDWARE NOT SUPPORTED ON DEVICE";
        }
    }

    function applyNightVisionFilter() {
        ctx.filter = "brightness(3.5) contrast(2.0) saturate(1.2)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.filter = "none";
    }

    function scanLoop() {
        if (!isScanning) return;

        if (!isFrozen) {
            applyNightVisionFilter();

            const w = canvas.width;
            const h = canvas.height;
            const boxSize = Math.min(w, h) * 0.42;
            const x = (w - boxSize) / 2;
            const y = (h - boxSize) / 2;

            drawReticle(x, y, boxSize, boxSize);
        }

        requestAnimationFrame(scanLoop);
    }

    function drawReticle(x, y, w, h) {
        const cLen = w * 0.22;

        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y);
        ctx.moveTo(x + w - cLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cLen);
        ctx.moveTo(x, y + h - cLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cLen, y + h);
        ctx.moveTo(x + w - cLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cLen);
        ctx.stroke();

        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - 15, cy - 15, 30, 30);

        ctx.fillStyle = '#00f3ff';
        ctx.font = "14px 'Share Tech Mono'";
        ctx.fillText("[ FOCUS MATRIX LOCK ]", x, y - 10);
    }

    function triggerSearch() {
        window.open('https://lens.google.com/', '_blank');
        statusText.innerText = "DISPATCHING VISUAL SEARCH ENGINE...";
    }
</script>
</body>
</html>
