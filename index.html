<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANES </title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --hud-bg: rgba(2, 8, 14, 0.93);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(0, 243, 255, 0.2);
            pointer-events: none;
            z-index: 2;
        }

        .hud-header {
            position: absolute;
            top: 25px;
            left: 35px;
            background: var(--hud-bg);
            padding: 12px 24px;
            border-left: 4px solid var(--neon-green);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            z-index: 3;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-green);
        }

        .hud-header span {
            font-size: 0.78rem;
            color: var(--neon-cyan);
        }

        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 390px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 20px;
            display: none;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            z-index: 3;
            backdrop-filter: blur(8px);
        }

        .hud-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.15rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 6px;
            letter-spacing: 1px;
        }

        .hud-card .data-row {
            margin: 7px 0;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #8a9ba8; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .desc-box {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--neon-cyan);
            font-size: 0.82rem;
            color: #d1e0ea;
            line-height: 1.4;
        }

        .controls {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 3;
        }

        button {
            background: var(--hud-bg);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 14px 32px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.25s ease;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 25px var(--neon-green);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="hud-border"></div>

    <div class="hud-header">
        <h1>PHANES // FOCUS MATRIX v6.5</h1>
        <span id="status">STANDBY // PRESS INITIALIZE</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET ACQUIRED</h2>
        <div class="data-row"><span class="label">CLASSIFICATION:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">LOCK CONFIDENCE:</span> <span id="card-conf" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">SCALE / TYPE:</span> <span id="card-scale" class="val" style="color:var(--neon-green);">-</span></div>
        <div class="data-row"><span class="label">EST. VALUE RANGE:</span> <span id="card-price" class="val" style="color:var(--neon-cyan);">-</span></div>
        <div class="desc-box" id="card-desc">Scanning visual target registers...</div>
    </div>

    <div class="controls">
        <button onclick="initApp()">INITIALIZE AI FOCUS MATRIX</button>
    </div>
</div>

<script>
    let objectModel, faceModel;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');

    let activeTrack = null;
    let smoothBox = null;
    let memoryTimer = 0;
    const MEMORY_LIMIT = 60; // 2s lock retention

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 },
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "LOADING AI NEURAL NETWORKS...";
        objectModel = await cocoSsd.load();
        faceModel = await blazeface.load();
        
        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusText.innerText = "SYSTEM ACTIVE // NIGHT VISION OPTIMIZED";
        scanFrame();
    }

    function applyNightVision() {
        // High Contrast Low-Light Gain
        ctx.filter = "brightness(3.2) contrast(1.8) saturate(1.1)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.filter = "none";
    }

    async function scanFrame() {
        applyNightVision();

        const objects = await objectModel.detect(canvas);
        const faces = await faceModel.estimateFaces(canvas, false);

        let bestMatch = null;
        let bestBox = null;
        let bestScore = 0;

        // Process Objects
        objects.forEach(obj => {
            const [x, y, w, h] = obj.bbox;
            const area = w * h;
            let cls = obj.class.toLowerCase();

            // Ignore noise (<2500px area) and enforce confidence thresholds
            if (obj.score > 0.58 && area > 2500) {
                
                // Scale Discrimination: Toy Model vs Actual Car
                if (cls === 'car' || cls === 'truck') {
                    const canvasArea = canvas.width * canvas.height;
                    const ratio = area / canvasArea;
                    if (ratio < 0.08) {
                        cls = 'toy_model_car';
                    }
                }

                // Strict Non-Human Filter: Suppress fake "person" triggers on small items (bags, tissues)
                if (cls === 'person' && (w < 160 || h < 160 || (w/h > 1.8))) return;

                if (obj.score > bestScore) {
                    bestMatch = cls;
                    bestBox = obj.bbox;
                    bestScore = Math.round(obj.score * 100);
                }
            }
        });

        // Genuine Biometric Face Verification Only
        faces.forEach(face => {
            const x = face.topLeft[0];
            const y = face.topLeft[1];
            const w = face.bottomRight[0] - x;
            const h = face.bottomRight[1] - y;
            const aspectRatio = w / h;

            // Strict human facial geometry checks
            if (w > 50 && h > 50 && aspectRatio >= 0.6 && aspectRatio <= 1.4) {
                bestMatch = 'human_subject';
                bestBox = [x, y, w, h];
                bestScore = 98;
            }
        });

        // Kalman Coordinate Smoothing
        if (bestMatch && bestBox) {
            activeTrack = { label: bestMatch, score: bestScore };
            memoryTimer = MEMORY_LIMIT;

            if (!smoothBox) {
                smoothBox = [...bestBox];
            } else {
                smoothBox[0] = smoothBox[0] * 0.75 + bestBox[0] * 0.25;
                smoothBox[1] = smoothBox[1] * 0.75 + bestBox[1] * 0.25;
                smoothBox[2] = smoothBox[2] * 0.75 + bestBox[2] * 0.25;
                smoothBox[3] = smoothBox[3] * 0.75 + bestBox[3] * 0.25;
            }
        } else if (memoryTimer > 0) {
            memoryTimer--;
        } else {
            activeTrack = null;
            smoothBox = null;
        }

        if (activeTrack && smoothBox) {
            const [x, y, w, h] = smoothBox;
            drawReticle(x, y, w, h, activeTrack.label.toUpperCase());

            infoCard.style.display = 'block';
            document.getElementById('card-conf').innerText = `${activeTrack.score}%`;

            renderMetadata(activeTrack.label);
        } else {
            infoCard.style.display = 'none';
        }

        requestAnimationFrame(scanFrame);
    }

    function renderMetadata(label) {
        const titleEl = document.getElementById('card-title');
        const entityEl = document.getElementById('card-entity');
        const scaleEl = document.getElementById('card-scale');
        const priceEl = document.getElementById('card-price');
        const descEl = document.getElementById('card-desc');

        if (label === 'toy_model_car') {
            titleEl.innerText = "MINIATURE / TOY CAR";
            entityEl.innerText = "SCALE MODEL VEHICLE";
            scaleEl.innerText = "SMALL (< 1:18 SCALE)";
            priceEl.innerText = "$5.00 - $40.00 USD";
            descEl.innerText = "Dimensions confirm miniature scale object rather than full-size automotive.";
        } else if (label === 'car' || label === 'truck') {
            titleEl.innerText = "MOTOR VEHICLE";
            entityEl.innerText = "PASSENGER AUTOMOTIVE";
            scaleEl.innerText = "FULL SCALE (1:1)";
            priceEl.innerText = "$15,000 - $85,000 USD";
            descEl.innerText = "Full-size vehicle confirmed in target field.";
        } else if (label === 'handbag' || label === 'backpack' || label === 'suitcase') {
            titleEl.innerText = "BAG / PERSONAL CARRY";
            entityEl.innerText = label.toUpperCase();
            scaleEl.innerText = "PERSONAL CONTAINER";
            priceEl.innerText = "$25.00 - $250.00 USD";
            descEl.innerText = "Storage accessory detected and locked via neural vision.";
        } else if (label === 'human_subject') {
            titleEl.innerText = "HUMAN SUBJECT";
            entityEl.innerText = "BIOMETRIC ENTITY";
            scaleEl.innerText = "ORGANIC LIFEFORM";
            priceEl.innerText = "N/A (CLASSIFIED)";
            descEl.innerText = "Facial mesh alignment verified via real-time geometric vision lock.";
        } else {
            titleEl.innerText = label.toUpperCase();
            entityEl.innerText = label.toUpperCase();
            scaleEl.innerText = "OBJECT ENTITY";
            priceEl.innerText = "VERIFIED TARGET";
            descEl.innerText = "Target identity locked and stabilized via neural tracking memory.";
        }
    }

    function drawReticle(x, y, w, h, label) {
        const cLen = Math.min(w, h) * 0.25;

        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y);
        ctx.moveTo(x + w - cLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cLen);
        ctx.moveTo(x, y + h - cLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cLen, y + h);
        ctx.moveTo(x + w - cLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cLen);
        ctx.stroke();

        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - 4, cy - 4, 8, 8);

        ctx.fillStyle = '#00ff66';
        ctx.font = "13px 'Share Tech Mono'";
        ctx.fillText(`[ LOCK // ${label} ]`, x, y - 8);
    }
</script>
</body>
</html>
