<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phanes.   </title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --hud-bg: rgba(5, 12, 20, 0.92);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Clean Frame Border */
        .corner-frame {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--neon-cyan);
            z-index: 3;
            pointer-events: none;
            opacity: 0.8;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Tactical Header Bar */
        .hud-header {
            position: absolute;
            top: 25px;
            left: 60px;
            background: var(--hud-bg);
            padding: 10px 20px;
            border-left: 4px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            z-index: 3;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-yellow);
        }

        .hud-header span {
            font-size: 0.75rem;
            color: var(--neon-cyan);
        }

        /* Instant Clean HUD Info Panel */
        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 380px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 18px;
            display: none;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            z-index: 3;
        }

        .hud-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.4);
            padding-bottom: 5px;
        }

        .hud-card .data-row {
            margin: 6px 0;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #8a9ba8; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .desc-box {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 2px solid var(--neon-cyan);
            font-size: 0.82rem;
            color: #d1e0ea;
            line-height: 1.35;
        }

        .controls {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 3;
        }

        button {
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="corner-frame top-left"></div>
    <div class="corner-frame top-right"></div>
    <div class="corner-frame bottom-left"></div>
    <div class="corner-frame bottom-right"></div>

    <div class="hud-header">
        <h1>PHANES // FOCUS HUD v4.0</h1>
        <span id="status">PRESS INITIALIZE TO ENGAGE</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET ACQUIRED</h2>
        <div class="data-row"><span class="label">ENTITY:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">CONFIDENCE:</span> <span id="card-conf" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">BRAND / ORIGIN:</span> <span id="card-brand" class="val">-</span></div>
        <div class="data-row"><span class="label">EST. VALUE / COST:</span> <span id="card-price" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">SOCIAL / LINK:</span> <span id="card-social" class="val" style="color:var(--neon-cyan);">-</span></div>
        <div class="desc-box" id="card-desc">Scanning visual target registers...</div>
    </div>

    <div class="controls">
        <button onclick="initApp()">INITIALIZE FOCUS</button>
    </div>
</div>

<script>
    let objectModel, faceModel;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');

    let currentLockedTarget = null;
    let targetBox = null;
    let currentScore = 0;

    const KNOWLEDGE_BASE = {
        cell_phone: {
            title: "SMARTPHONE TARGET",
            brand: "Apple / Samsung / Google",
            price: "$799 - $1,199 USD",
            social: "@tech_reviews / #mobile",
            desc: "High-density mobile terminal equipped with multi-lens optical array and neural processing unit."
        },
        car: {
            title: "MOTOR VEHICLE",
            brand: "Tesla / BMW / CyberMotors",
            price: "$42,000 - $85,000 USD",
            social: "@autoworld_daily",
            desc: "Autonomous or semi-autonomous passenger vehicle with electric or hybrid drivetrain."
        },
        laptop: {
            title: "COMPUTING WORKSTATION",
            brand: "Dell / Lenovo / Apple",
            price: "$1,200 - $2,499 USD",
            social: "@cyber_hardware",
            desc: "Portable terminal featuring multi-core silicon, high-refresh display, and integrated encrypted storage."
        },
        bottle: {
            title: "BEVERAGE CONTAINER",
            brand: "Hydro / Stanley / Generic",
            price: "$15 - $45 USD",
            social: "#hydration_tech",
            desc: "Insulated liquid vessel engineered for heat retention and durable field usage."
        },
        handbag: {
            title: "BAG / ACCESSORY",
            brand: "Gucci / Nike / Generic",
            price: "$60 - $350 USD",
            social: "#fashion_carry",
            desc: "Storage carry pouch or bag designed for personal transport."
        },
        person: {
            title: "HUMAN SUBJECT DETECTED",
            brand: "Biometric Subject",
            price: "N/A (CLASSIFIED)",
            social: "@subject_profile_linked",
            desc: "Biological entity locked via neural vision face-mesh verification."
        }
    };

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 },
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "LOADING NEURAL VISION NETWORKS...";
        objectModel = await cocoSsd.load();
        faceModel = await blazeface.load();
        
        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusText.innerText = "NIGHT VISION & FOCUS ENGAGED";
        scanFrame();
    }

    // Dynamic Low-Light Brightness Gain Filter
    function applyLowLightEnhancement() {
        ctx.filter = "brightness(1.5) contrast(1.3) saturate(1.1)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.filter = "none"; // Reset filter for HUD rendering
    }

    async function scanFrame() {
        // Draw low-light video enhancement onto canvas
        applyLowLightEnhancement();

        const objects = await objectModel.detect(canvas);
        const faces = await faceModel.estimateFaces(canvas, false);

        let detectedInFrame = null;
        let detectedBox = null;
        let score = 0;

        // Strict Object Verification (Eliminates false positives like tissues/bags)
        objects.forEach(obj => {
            const [x, y, w, h] = obj.bbox;
            const area = w * h;
            
            // Rejects tiny shadow shapes and requires >65% confidence
            if (obj.score > 0.65 && area > 2500 && !detectedInFrame) {
                // Ignore accidental person detections on small objects (e.g. tissues)
                if (obj.class === 'person' && (w < 120 || h < 120)) return;
                
                detectedInFrame = obj.class.toLowerCase();
                detectedBox = obj.bbox;
                score = Math.round(obj.score * 100);
            }
        });

        // Face Biometric Override
        faces.forEach(face => {
            if (!detectedInFrame) {
                const x = face.topLeft[0];
                const y = face.topLeft[1];
                const w = face.bottomRight[0] - x;
                const h = face.bottomRight[1] - y;
                
                // Real human face verification
                if (w > 40 && h > 40) {
                    detectedInFrame = 'person';
                    detectedBox = [x, y, w, h];
                    score = 98;
                }
            }
        });

        currentLockedTarget = detectedInFrame;
        targetBox = detectedBox;
        currentScore = score;

        // Instant Information HUD Updating
        if (currentLockedTarget && targetBox) {
            const [x, y, w, h] = targetBox;
            
            drawTargetReticle(x, y, w, h, currentLockedTarget.toUpperCase());

            infoCard.style.display = 'block';
            document.getElementById('card-conf').innerText = `${currentScore}%`;

            const data = KNOWLEDGE_BASE[currentLockedTarget] || {
                title: "VERIFIED OBJECT",
                brand: "Standard Entity",
                price: "$10 - $150 USD",
                social: "#unindexed_item",
                desc: "Target identity confirmed via local neural weights."
            };

            document.getElementById('card-title').innerText = data.title;
            document.getElementById('card-entity').innerText = currentLockedTarget.toUpperCase();
            document.getElementById('card-brand').innerText = data.brand;
            document.getElementById('card-price').innerText = data.price;
            document.getElementById('card-social').innerText = data.social;
            document.getElementById('card-desc').innerText = data.desc;

        } else {
            infoCard.style.display = 'none';
        }

        requestAnimationFrame(scanFrame);
    }

    function drawTargetReticle(x, y, w, h, label) {
        const cornerLen = Math.min(w, h) * 0.25;

        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;

        // Target Corners
        ctx.beginPath();
        ctx.moveTo(x, y + cornerLen); ctx.lineTo(x, y); ctx.lineTo(x + cornerLen, y);
        ctx.moveTo(x + w - cornerLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cornerLen);
        ctx.moveTo(x, y + h - cornerLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cornerLen, y + h);
        ctx.moveTo(x + w - cornerLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cornerLen);
        ctx.stroke();

        // Center Aim Box
        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ffee00';
        ctx.strokeRect(cx - 5, cy - 5, 10, 10);

        // Instant HUD Text Tag
        ctx.fillStyle = '#00f3ff';
        ctx.font = "13px 'Share Tech Mono'";
        ctx.fillText(`[ ${label} ]`, x, y - 8);
    }
</script>
</body>
</html>
