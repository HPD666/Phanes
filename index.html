<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phanes.&#12288;&#12288;&#12288;&#12288;&#12288;</title>
    
    <!-- FAVICON (Embedded SVG vector matching the 'P' logo) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%231B55FF' d='M20.2 18.2L38 4.8l58.8 7.8-15.6 12.3 8.3 12.5-22.1 14-25.3-7.7 29.4-10.3L39.8 20.3 32.3 39 10.3 56.2zM2.4 86.6l30.4-30.8L22 75.3z'/></svg>">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --hud-cyan: #00f3ff;
            --hud-green: #00ff66;
            --hud-yellow: #ffee00;
            --hud-orange: #ff9900;
            --hud-bg: rgba(6, 14, 24, 0.90);
            --hud-panel-border: rgba(0, 243, 255, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--hud-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(0, 243, 255, 0.2);
            pointer-events: none;
            z-index: 2;
        }

        .hud-header {
            position: absolute;
            top: 25px;
            left: 35px;
            background: var(--hud-bg);
            padding: 12px 24px;
            border-left: 4px solid var(--hud-cyan);
            border-bottom: 1px solid var(--hud-panel-border);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.12);
            z-index: 3;
            border-radius: 0 4px 4px 0;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--hud-cyan);
        }

        .hud-header span {
            font-size: 0.78rem;
            color: var(--hud-green);
        }

        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 420px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-panel-border);
            border-top: 3px solid var(--hud-cyan);
            padding: 20px;
            display: none;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.18);
            z-index: 3;
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        .hud-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: var(--hud-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.25);
            padding-bottom: 6px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-card .category-tag {
            font-size: 0.7rem;
            background: rgba(0, 243, 255, 0.15);
            color: var(--hud-cyan);
            padding: 2px 8px;
            border-radius: 2px;
        }

        .hud-card .data-row {
            margin: 8px 0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-card .label { color: #9bb0c1; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .price-section {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(0, 255, 102, 0.06);
            border-left: 3px solid var(--hud-green);
            border-radius: 2px;
        }

        .price-section .title {
            font-size: 0.75rem;
            color: var(--hud-green);
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .buy-btn {
            display: inline-block;
            margin-top: 10px;
            width: 100%;
            text-align: center;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--hud-cyan);
            color: var(--hud-cyan);
            padding: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.82rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .buy-btn:hover {
            background: var(--hud-cyan);
            color: #000;
        }

        .desc-box {
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--hud-cyan);
            font-size: 0.82rem;
            color: #d1e0ea;
            line-height: 1.4;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="hud-border"></div>

    <div class="hud-header">
        <h1>PHANES // VISION SYSTEM</h1>
        <span id="status">INITIALIZING SYSTEM...</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2>
            <span id="card-title">TARGET LOCKED</span>
            <span id="card-cat" class="category-tag">OBJECT</span>
        </h2>
        <div class="data-row"><span class="label">CLASSIFICATION:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">DETECTION CONFIDENCE:</span> <span id="card-conf" class="val" style="color:var(--hud-green);">-</span></div>
        <div class="data-row"><span class="label">FRAME RATIO (W:H):</span> <span id="card-ratio" class="val" style="color:var(--hud-yellow);">-</span></div>
        
        <div class="price-section">
            <div class="title">PRICE ESTIMATOR</div>
            <div class="data-row"><span class="label">EST. MARKET VALUE:</span> <span id="card-price-range" class="val" style="color:var(--hud-cyan);">-</span></div>
            <div class="data-row"><span class="label">EST. RETAIL NEW:</span> <span id="card-price-new" class="val">-</span></div>
            <div class="data-row"><span class="label">EST. USED / REFURB:</span> <span id="card-price-used" class="val">-</span></div>
            <div class="data-row"><span class="label">ITEM CONDITION:</span> <span id="card-condition" class="val" style="color:var(--hud-green);">-</span></div>
            
            <a id="card-link" href="#" target="_blank" class="buy-btn">SEARCH / FIND ITEM ONLINE</a>
        </div>

        <div class="desc-box" id="card-desc">Analyzing spatial dimensions...</div>
    </div>
</div>

<script>
    let objectModel, faceModel;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');

    // Dedicated offscreen canvas for high-precision inference processing
    const aiCanvas = document.createElement('canvas');
    const aiCtx = aiCanvas.getContext('2d', { willReadFrequently: true });
    
    // Higher internal resolution for accuracy
    aiCanvas.width = 640;
    aiCanvas.height = 480;

    let activeTrack = null;
    let smoothBox = null;
    let targetBox = null;
    let frameHistory = [];
    const HISTORY_LIMIT = 12;

    let targetOffsetX = 0;
    let targetOffsetY = 0;
    let currentOffsetX = 0;
    let currentOffsetY = 0;

    let isAiBusy = false;
    let rawObjects = [];
    let faces = [];
    let allDetectedBoxes = [];

    let lastFrameTime = performance.now();
    let frameCount = 0;
    let currentFPS = 0;

    document.addEventListener('DOMContentLoaded', initApp);

    window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null && e.beta !== null) {
            targetOffsetX = e.gamma * 2.5;
            targetOffsetY = (e.beta - 45) * 2.5;
        }
    });

    window.addEventListener('mousemove', (e) => {
        targetOffsetX = ((e.clientX / window.innerWidth) - 0.5) * 120;
        targetOffsetY = ((e.clientY / window.innerHeight) - 0.5) * 120;
    });

    const livingClasses = new Set([
        'person', 'human', 'cat', 'dog', 'bird', 'horse', 'sheep', 
        'cow', 'elephant', 'bear', 'zebra', 'giraffe'
    ]);

    async function setupCamera() {
        const constraints = {
            video: {
                facingMode: 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
        } catch (err) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        }

        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        try {
            statusText.innerText = "LOADING VISION MODELS...";
            await tf.setBackend('webgl');
            await tf.ready();

            // Load full accuracy mobilenet_v2 model without manual override hacks
            objectModel = await cocoSsd.load({ base: 'mobilenet_v2' });
            faceModel = await blazeface.load();

            statusText.innerText = "STARTING CAMERA...";
            await setupCamera();
            
            canvas.width = video.videoWidth || window.innerWidth;
            canvas.height = video.videoHeight || window.innerHeight;

            runAiLoop();
            renderLoop();
        } catch (e) {
            statusText.innerText = "ERROR INITIALIZING VISION SYSTEM: " + e.message;
        }
    }

    async function runAiLoop() {
        if (!isAiBusy && video.readyState === 4) {
            isAiBusy = true;

            aiCtx.drawImage(video, 0, 0, aiCanvas.width, aiCanvas.height);

            const scaleX = canvas.width / aiCanvas.width;
            const scaleY = canvas.height / aiCanvas.height;

            try {
                const [objRes, faceRes] = await Promise.all([
                    objectModel.detect(aiCanvas, 10, 0.55), // Raised threshold to eliminate false positive noise
                    faceModel.estimateFaces(aiCanvas, false)
                ]);

                rawObjects = objRes.map(obj => ({
                    ...obj,
                    bbox: [
                        obj.bbox[0] * scaleX,
                        obj.bbox[1] * scaleY,
                        obj.bbox[2] * scaleX,
                        obj.bbox[3] * scaleY
                    ]
                }));

                faces = faceRes.map(face => ({
                    topLeft: [face.topLeft[0] * scaleX, face.topLeft[1] * scaleY],
                    bottomRight: [face.bottomRight[0] * scaleX, face.bottomRight[1] * scaleY]
                }));

                processDetections();
            } catch (err) {
                console.error(err);
            }

            isAiBusy = false;
        }

        setTimeout(runAiLoop, 40);
    }

    function processDetections() {
        let validatedLabel = null;
        let bestBox = null;
        let maxScore = 0;

        allDetectedBoxes = [];

        // Direct AI confidence-based extraction
        rawObjects.forEach(obj => {
            const [x, y, w, h] = obj.bbox;
            const area = w * h;
            const cls = obj.class.toLowerCase();

            if (obj.score < 0.55 || area < 1000) return;

            allDetectedBoxes.push(obj.bbox);

            if (obj.score > maxScore) {
                maxScore = obj.score;
                validatedLabel = cls;
                bestBox = obj.bbox;
            }
        });

        faces.forEach(face => {
            const x = face.topLeft[0];
            const y = face.topLeft[1];
            const w = face.bottomRight[0] - x;
            const h = face.bottomRight[1] - y;

            if (w > 30 && h > 30) {
                validatedLabel = 'human';
                bestBox = [x, y, w, h];
                maxScore = 0.98;
                allDetectedBoxes.push(bestBox);
            }
        });

        if (validatedLabel && bestBox) {
            frameHistory.push({ label: validatedLabel, box: bestBox, score: Math.round(maxScore * 100) });
        } else {
            frameHistory.push(null);
        }

        if (frameHistory.length > HISTORY_LIMIT) frameHistory.shift();

        const counts = {};
        let winner = null;
        let winnerCount = 0;

        frameHistory.forEach(item => {
            if (item) {
                counts[item.label] = (counts[item.label] || 0) + 1;
                if (counts[item.label] > winnerCount) {
                    winnerCount = counts[item.label];
                    winner = item.label;
                }
            }
        });

        // Require majority consensus across history buffer to stabilize label locking
        if (winner && winnerCount >= 4) {
            const latestMatch = [...frameHistory].reverse().find(i => i && i.label === winner);
            activeTrack = { label: winner, score: latestMatch.score };
            targetBox = latestMatch.box;
        } else {
            activeTrack = null;
            targetBox = null;
        }
    }

    function renderLoop() {
        const now = performance.now();
        frameCount++;

        if (now - lastFrameTime >= 1000) {
            currentFPS = Math.round((frameCount * 1000) / (now - lastFrameTime));
            frameCount = 0;
            lastFrameTime = now;

            statusText.innerText = `SYSTEM ACTIVE // ${canvas.width}x${canvas.height} @ ${currentFPS} FPS`;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        currentOffsetX += (targetOffsetX - currentOffsetX) * 0.1;
        currentOffsetY += (targetOffsetY - currentOffsetY) * 0.1;

        drawHUDMotionOverlay();
        drawVectorLedges(allDetectedBoxes);

        if (activeTrack && targetBox) {
            if (!smoothBox) {
                smoothBox = [...targetBox];
            } else {
                smoothBox[0] += (targetBox[0] - smoothBox[0]) * 0.2;
                smoothBox[1] += (targetBox[1] - smoothBox[1]) * 0.2;
                smoothBox[2] += (targetBox[2] - smoothBox[2]) * 0.2;
                smoothBox[3] += (targetBox[3] - smoothBox[3]) * 0.2;
            }

            const [x, y, w, h] = smoothBox;
            drawReticle(x, y, w, h, activeTrack.label.toUpperCase());

            infoCard.style.display = 'block';
            document.getElementById('card-conf').innerText = `${activeTrack.score}%`;
            document.getElementById('card-ratio').innerText = `${(w/h).toFixed(2)}`;

            renderMetadataAndPrice(activeTrack.label, w, h, activeTrack.score);
        } else {
            smoothBox = null;
            infoCard.style.display = 'none';
        }

        requestAnimationFrame(renderLoop);
    }

    function drawHUDMotionOverlay() {
        const cx = (canvas.width / 2) + currentOffsetX;
        const cy = (canvas.height / 2) + currentOffsetY;

        ctx.strokeStyle = "rgba(0, 243, 255, 0.35)";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(cx - 60, cy); ctx.lineTo(cx - 15, cy);
        ctx.moveTo(cx + 15, cy); ctx.lineTo(cx + 60, cy);
        ctx.moveTo(cx, cy - 60); ctx.lineTo(cx, cy - 15);
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx, cy + 60);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 238, 0, 0.5)";
        ctx.strokeRect(cx - 3, cy - 3, 6, 6);
    }

    function drawVectorLedges(boxes) {
        ctx.strokeStyle = "rgba(255, 153, 0, 0.85)";
        ctx.lineWidth = 1.5;

        boxes.forEach(box => {
            const [x, y, w, h] = box;
            const mx = currentOffsetX * 0.15;
            const my = currentOffsetY * 0.15;

            ctx.beginPath();
            ctx.moveTo(x - 10 + mx, y + my);
            ctx.lineTo(x + w + 10 + mx, y + my);
            ctx.moveTo(x + mx, y - 4 + my); ctx.lineTo(x + mx, y + 4 + my);
            ctx.moveTo(x + w + mx, y - 4 + my); ctx.lineTo(x + w + mx, y + 4 + my);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 5 + mx, y + h + my);
            ctx.lineTo(x + w + 5 + mx, y + h + my);
            ctx.stroke();
        });
    }

    function renderMetadataAndPrice(label, w, h, score) {
        const titleEl = document.getElementById('card-title');
        const catEl = document.getElementById('card-cat');
        const entityEl = document.getElementById('card-entity');
        const rangeEl = document.getElementById('card-price-range');
        const newEl = document.getElementById('card-price-new');
        const usedEl = document.getElementById('card-price-used');
        const condEl = document.getElementById('card-condition');
        const descEl = document.getElementById('card-desc');
        const linkEl = document.getElementById('card-link');

        const cleanLabel = label.toUpperCase();

        titleEl.innerText = cleanLabel;
        catEl.innerText = livingClasses.has(label) ? "BIOMETRIC / LIVING" : "OBJECT";
        entityEl.innerText = cleanLabel;
        descEl.innerText = `Detected via neural spatial pattern matching.`;

        linkEl.href = `https://www.google.com/search?tbm=shop&q=${encodeURIComponent(cleanLabel)}`;
        linkEl.innerText = `FIND ${cleanLabel} ONLINE ↗`;

        if (livingClasses.has(label)) {
            rangeEl.innerText = "N/A (LIVING BEING)";
            newEl.innerText = "N/A";
            usedEl.innerText = "N/A";
            condEl.innerText = "ACTIVE";
            linkEl.style.display = 'none';
            return;
        }

        linkEl.style.display = 'inline-block';

        rangeEl.innerText = "MARKET DEPENDENT";
        newEl.innerText = "ESTIMATING...";
        usedEl.innerText = "ESTIMATING...";
        condEl.innerText = score > 85 ? "HIGH ACCURACY" : "STANDARD ACCURACY";
    }

    function drawReticle(x, y, w, h, label) {
        const cLen = Math.min(w, h) * 0.25;

        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y);
        ctx.moveTo(x + w - cLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cLen);
        ctx.moveTo(x, y + h - cLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cLen, y + h);
        ctx.moveTo(x + w - cLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cLen);
        ctx.stroke();

        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - 5, cy - 5, 10, 10);

        ctx.fillStyle = '#00f3ff';
        ctx.font = "13px 'Share Tech Mono'";
        ctx.fillText(`[ TRACKING // ${label} ]`, x, y - 10);
    }
</script>
</body>
</html>
