<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANES // </title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-pink: #ff0055;
            --hud-bg: rgba(5, 12, 20, 0.88);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #020408;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Cyberpunk FX Layers */
        .scanlines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                        radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.4) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 2;
        }

        .corner-frame {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-cyan);
            z-index: 3;
            pointer-events: none;
            opacity: 0.7;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Tactical Header Bar */
        .hud-header {
            position: absolute;
            top: 25px;
            left: 70px;
            background: var(--hud-bg);
            padding: 10px 20px;
            border-left: 4px solid var(--neon-cyan);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            z-index: 3;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
        }

        .hud-header h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .hud-header span {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        /* Sci-Fi HUD Info Panel */
        .hud-card {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 380px;
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            padding: 18px;
            display: none;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
            z-index: 3;
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
        }

        .hud-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.4);
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .hud-card .data-row {
            margin: 6px 0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .hud-card .label { color: #8a9ba8; }
        .hud-card .val { color: #fff; font-weight: bold; }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--neon-cyan);
            margin: 10px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.05s ease-out;
        }

        .desc-box {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 243, 255, 0.04);
            border-left: 2px solid var(--neon-cyan);
            font-size: 0.80rem;
            color: #d1e0ea;
            line-height: 1.35;
        }

        .controls {
            position: absolute;
            bottom: 35px;
            left: 35px;
            z-index: 3;
        }

        button {
            background: var(--hud-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
            clip-path: polygon(0 0, 90% 0, 100% 30%, 100% 100%, 10% 100%, 0 70%);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div class="scanlines"></div>
    <div class="corner-frame top-left"></div>
    <div class="corner-frame top-right"></div>
    <div class="corner-frame bottom-left"></div>
    <div class="corner-frame bottom-right"></div>

    <div class="hud-header">
        <h1>PHANES // FOCUS HUD v3.0</h1>
        <span id="status">PRESS INITIALIZE TO ENGAGE</span>
    </div>

    <div id="info-card" class="hud-card">
        <h2 id="card-title">TARGET ACQUIRED</h2>
        <div class="data-row"><span class="label">ENTITY:</span> <span id="card-entity" class="val">-</span></div>
        <div class="data-row"><span class="label">SCAN PROGRESS:</span> <span id="card-pct" class="val" style="color:var(--neon-yellow);">0%</span></div>
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="data-row"><span class="label">BRAND / ORIGIN:</span> <span id="card-brand" class="val">-</span></div>
        <div class="data-row"><span class="label">EST. VALUE / COST:</span> <span id="card-price" class="val" style="color:var(--neon-yellow);">-</span></div>
        <div class="data-row"><span class="label">SOCIAL / LINK:</span> <span id="card-social" class="val" style="color:var(--neon-cyan);">-</span></div>
        <div class="desc-box" id="card-desc">Scanning visual target registers...</div>
    </div>

    <div class="controls">
        <button onclick="initApp()">INITIALIZE FOCUS</button>
    </div>
</div>

<script>
    let objectModel, faceModel;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const infoCard = document.getElementById('info-card');
    const progressFill = document.getElementById('progress-fill');
    const cardPct = document.getElementById('card-pct');

    let currentLockedTarget = null;
    let targetBox = null;
    let scanProgress = 0;
    let persistentCounter = 0;
    const PERSIST_LIMIT = 30; // Keeps target tracked cleanly for 1 second if obscured

    const KNOWLEDGE_BASE = {
        cell_phone: {
            title: "SMARTPHONE TARGET",
            brand: "Apple / Samsung / Google",
            price: "$799 - $1,199 USD",
            social: "@tech_reviews / #mobile",
            desc: "High-density mobile terminal equipped with multi-lens optical array and neural processing unit."
        },
        car: {
            title: "MOTOR VEHICLE",
            brand: "Tesla / BMW / CyberMotors",
            price: "$42,000 - $85,000 USD",
            social: "@autoworld_daily",
            desc: "Autonomous or semi-autonomous passenger vehicle with electric or hybrid drivetrain."
        },
        laptop: {
            title: "COMPUTING WORKSTATION",
            brand: "Dell / Lenovo / Apple",
            price: "$1,200 - $2,499 USD",
            social: "@cyber_hardware",
            desc: "Portable terminal featuring multi-core silicon, high-refresh display, and integrated encrypted storage."
        },
        bottle: {
            title: "BEVERAGE CONTAINER",
            brand: "Hydro / Stanley / Generic",
            price: "$15 - $45 USD",
            social: "#hydration_tech",
            desc: "Insulated liquid vessel engineered for heat retention and durable field usage."
        },
        person: {
            title: "HUMAN SUBJECT DETECTED",
            brand: "Biometric Subject #802",
            price: "N/A (CLASSIFIED)",
            social: "@subject_profile_linked",
            desc: "Biological entity locked. Face detection algorithm active. Privacy protocols obfuscating registry match."
        }
    };

    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 },
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
    }

    async function initApp() {
        statusText.innerText = "LOADING NEURAL VISION NETWORKS...";
        objectModel = await cocoSsd.load();
        faceModel = await blazeface.load();
        
        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusText.innerText = "FOCUS SCANNER OPERATIONAL";
        scanFrame();
    }

    async function scanFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const objects = await objectModel.detect(video);
        const faces = await faceModel.estimateFaces(video, false);

        let detectedInFrame = null;
        let detectedBox = null;

        // Detect Objects
        objects.forEach(obj => {
            if (obj.score > 0.40 && !detectedInFrame) {
                detectedInFrame = obj.class.toLowerCase();
                detectedBox = obj.bbox;
            }
        });

        // Detect Faces
        faces.forEach(face => {
            if (!detectedInFrame) {
                detectedInFrame = 'person';
                const x = face.topLeft[0];
                const y = face.topLeft[1];
                const w = face.bottomRight[0] - x;
                const h = face.bottomRight[1] - y;
                detectedBox = [x, y, w, h];
            }
        });

        // Sticky Lock Memory Engine
        if (detectedInFrame) {
            currentLockedTarget = detectedInFrame;
            targetBox = detectedBox;
            persistentCounter = PERSIST_LIMIT;
        } else if (persistentCounter > 0) {
            persistentCounter--;
        } else {
            currentLockedTarget = null;
            targetBox = null;
            scanProgress = 0;
        }

        // Render HUD Target & Rapid Scan Progress
        if (currentLockedTarget && targetBox) {
            const [x, y, w, h] = targetBox;
            
            // Fast Progress Fill (~0.5s total scan speed)
            if (scanProgress < 100) {
                scanProgress += 12;
                if (scanProgress > 100) scanProgress = 100;
            }

            drawProReticle(x, y, w, h, currentLockedTarget.toUpperCase(), scanProgress);

            infoCard.style.display = 'block';
            cardPct.innerText = `${scanProgress}%`;
            progressFill.style.width = `${scanProgress}%`;

            const data = KNOWLEDGE_BASE[currentLockedTarget] || {
                title: "GENERIC OBJECT",
                brand: "Unknown Brand",
                price: "Market Search Active",
                social: "#unindexed",
                desc: "Target category verified in public dataset."
            };

            document.getElementById('card-title').innerText = scanProgress < 100 ? "SEARCHING..." : data.title;
            document.getElementById('card-entity').innerText = currentLockedTarget.toUpperCase();
            document.getElementById('card-brand').innerText = scanProgress < 100 ? "Scanning..." : data.brand;
            document.getElementById('card-price').innerText = scanProgress < 100 ? "Calculating..." : data.price;
            document.getElementById('card-social').innerText = scanProgress < 100 ? "Resolving..." : data.social;
            document.getElementById('card-desc').innerText = scanProgress < 100 ? "Analyzing visual signature..." : data.desc;

        } else {
            infoCard.style.display = 'none';
        }

        requestAnimationFrame(scanFrame);
    }

    // Professional Cyberpunk Canvas Reticle Rendering
    function drawProReticle(x, y, w, h, label, progress) {
        const cornerLen = Math.min(w, h) * 0.25;

        // Glowing outer bounding box
        ctx.strokeStyle = progress < 100 ? 'rgba(255, 238, 0, 0.8)' : 'rgba(0, 243, 255, 0.9)';
        ctx.lineWidth = 2;

        // Tactical Corner Accents
        ctx.beginPath();
        // Top-Left
        ctx.moveTo(x, y + cornerLen); ctx.lineTo(x, y); ctx.lineTo(x + cornerLen, y);
        // Top-Right
        ctx.moveTo(x + w - cornerLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cornerLen);
        // Bottom-Left
        ctx.moveTo(x, y + h - cornerLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cornerLen, y + h);
        // Bottom-Right
        ctx.moveTo(x + w - cornerLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cornerLen);
        ctx.stroke();

        // Center Crosshair
        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
        ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
        ctx.stroke();

        // Canvas Scan Progress Bar
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(x, y + h + 8, w, 5);
        ctx.fillStyle = progress < 100 ? '#ffee00' : '#00f3ff';
        ctx.fillRect(x, y + h + 8, (w * progress) / 100, 5);

        // HUD Text Tag
        ctx.fillStyle = progress < 100 ? '#ffee00' : '#00f3ff';
        ctx.font = "13px 'Share Tech Mono'";
        ctx.fillText(`[ ${label} ] - ${progress}%`, x, y - 8);
    }
</script>
</body>
</html>
